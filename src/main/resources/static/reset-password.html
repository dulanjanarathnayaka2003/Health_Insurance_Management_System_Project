<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HealthInsure</title>
</head>
<body>
<h2>Reset Password</h2>
<form id="resetForm">
    <input type="password" id="newPassword" placeholder="New password" required>
    <button type="submit">Reset</button>
</form>
<p id="resetMessage"></p>
<script>
    function getToken() {
        const params = new URLSearchParams(window.location.search);
        return params.get('token');
    }
    document.getElementById('resetForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const token = getToken();
        const newPassword = document.getElementById('newPassword').value;
        fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token, newPassword})
        }).then(res => {
            if (!res.ok) throw new Error('Reset failed');
            document.getElementById('resetMessage').textContent = 'Password reset successful. You can now log in.';
        }).catch(() => {
            document.getElementById('resetMessage').textContent = 'Invalid or expired reset link.';
        });
    });
</script>
</body>
</html>
